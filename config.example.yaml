# Keep It Configuration

app:
  # Name shown in the UI, the login page and the browser title.
  # Override via the APP_NAME env var.
  name: "Keep It"
  
server:
  host: "0.0.0.0"
  port: 8000
  reload: false  # Set to true for development
  
  # CORS (Cross-Origin Resource Sharing) configuration
  # For self-hosted use, "*" is fine. For production, specify allowed domains.
  # Examples: ["http://localhost:8000", "https://yourdomain.com"]
  allowed_origins: ["*"]
  
  # Debug mode - shows detailed error messages (DISABLE in production!)
  debug: false

  # Optional public origin for share links (scheme + host, no trailing slash).
  # When set, the share dialog / QR / clipboard use this instead of the browser's
  # origin — useful when you browse on LAN but want links like
  # https://notes.example.com/share/... Leave empty for normal behavior.
  # Override via the SHARE_PUBLIC_ORIGIN env var.
  share_public_origin: ""
  
storage:
  notes_dir: "./data"
  plugins_dir: "./plugins"
  
search:
  enabled: true

# User interface behavior
ui:
  # Theme used when a browser has not saved a theme preference yet.
  # Use a theme ID from the themes directory (the CSS filename without .css).
  # Override via the DEFAULT_THEME env var. Invalid values fall back to 'light'.
  default_theme: "light"

  # Autosave debounce in milliseconds (applies to note typing and drawing autosave).
  # Lower = saves more often (more disk writes); higher = saves less often.
  # Override via the AUTOSAVE_DELAY_MS env var. Server clamps to 250-60000ms.
  autosave_delay_ms: 1000

authentication:
  # Authentication settings
  # Set enabled to true to require login
  enabled: false
  
  # ⚠️ SECURITY WARNING: Change these values before exposing to the internet!
  # Default values below are for LOCAL TESTING ONLY
  
  # Session secret key. Leave empty to have a random one generated on first start
  # and kept in the notes folder (.secret-key). To set your own:
  # python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: ""
  
  # Password (hashed automatically at startup)
  # ⚠️ Default password is "admin" - CHANGE THIS for production!
  password: "admin"
  
  # PIN of 4 to 6 digits (hashed automatically at startup). When set, the login page
  # asks for the PIN instead of the password. Wrong tries make the next one wait
  # longer, but a 4-digit PIN is still weak on its own on the internet: prefer 6
  # digits, or put Cloudflare Access or similar in front. Leave empty for the password.
  pin: ""

  # Session expiry in seconds (default: 7 days) for "Remember this device".
  # Renewed whenever the app is used, so a device in use stays logged in.
  session_max_age: 604800

  # Without "Remember this device", a login ends this many hours after it began
  short_session_hours: 12

  # Proxies whose reported client address is trusted (IPs or CIDRs), such as
  # cloudflared or nginx. Wrong tries are counted per client: without this, everyone
  # behind the proxy counts as one client. Example: ["172.16.0.0/12"] for Docker.
  trusted_proxies: []

  # Cloudflare Access: requests it lets through need no PIN or password, and anything
  # else (the local network, a path Access bypasses) gets the login page. Set both:
  #   team_domain: your Zero Trust team domain, e.g. "myteam.cloudflareaccess.com"
  #   aud: the Access application's "Application Audience (AUD) Tag"
  # allowed_emails limits it to these users (a service token by its Client ID, "….access");
  # empty lets in anyone Access lets in.
  cloudflare_access:
    team_domain: ""
    aud: ""
    allowed_emails: []
  
  # API Key Authentication (for external integrations)
  # Usage (choose one):
  #   Authorization: Bearer YOUR_API_KEY
  #   X-API-Key: YOUR_API_KEY
  #
  # Generate a secure key with:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  #
  # Leave empty to disable API key authentication (only session auth works)
  api_key: ""

link_previews:
  # A link on a line of its own is shown as a card with the page's title, text and
  # image. The server fetches the page once and keeps the result in .links/ in the
  # notes folder. Override via the LINK_PREVIEWS_ENABLED env var.
  enabled: true

  # Links to this server's own network (localhost, 192.168.x.x, ...) get no card
  # unless this is true, so a note can't make the server probe its network. Turn it
  # on only if everyone who can edit notes may reach that network anyway.
  # Override via the LINK_PREVIEWS_ALLOW_PRIVATE_NETWORKS env var.
  allow_private_networks: false

archivebox:
  # Keep an offline copy of every link card in ArchiveBox (https://archivebox.io).
  # Cards then show whether the copy is ready, with buttons for the saved page, PDF
  # and screenshot, served through Keep It's login. Off while url is empty.
  # See documentation/ARCHIVEBOX.md. Override via ARCHIVEBOX_URL, ARCHIVEBOX_API_KEY
  # and ARCHIVEBOX_TAG.
  # The url must use the host in ArchiveBox's own BASE_URL (see its
  # /data/ArchiveBox.conf), or it refuses new pages with a 403.
  url: ""          # e.g. http://archivebox:5797
  api_key: ""      # an API token from ArchiveBox's admin
  tag: "keepit"

mcp:
  # Serve MCP (Model Context Protocol) over Streamable HTTP at /mcp, so AI
  # assistants can connect by URL instead of spawning the stdio server.
  # Uses the same auth as the REST API. When authentication is enabled,
  # authentication.api_key must be set or the endpoint stays off.
  # Override via the MCP_ENABLED env var.
  enabled: false
