    <!-- Preload translations before Alpine initializes -->
    <script>
        (function() {
            // Load translations synchronously to ensure they're available before Alpine renders
            const locale = localStorage.getItem('locale') || 'en-US';
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/locales/' + locale, false); // Synchronous request
            try {
                xhr.send();
                if (xhr.status === 200) {
                    window.__preloadedTranslations = JSON.parse(xhr.responseText);
                } else {
                    // Fallback to en-US if preferred locale fails
                    if (locale !== 'en-US') {
                        xhr.open('GET', '/api/locales/en-US', false);
                        xhr.send();
                        if (xhr.status === 200) {
                            window.__preloadedTranslations = JSON.parse(xhr.responseText);
                            localStorage.setItem('locale', 'en-US');
                        }
                    }
                }
            } catch (e) {
                console.error('Failed to preload translations:', e);
                window.__preloadedTranslations = {};
            }
        })();
    </script>
    
    <!-- Preload the theme before Alpine renders, so a reload doesn't flash.
         A saved preference wins; otherwise the configured default (__DEFAULT_THEME__).
         data-theme is set only after the CSS is parsed and inserted. app.js reuses
         #dynamic-theme and skips a second download when the id still matches. -->
    <script>
        (function() {
            try {
                const themeId = localStorage.getItem('noteDiscoveryTheme') || '__DEFAULT_THEME__';
                if (!themeId) return;
                const xhr = new XMLHttpRequest();
                xhr.open('GET', '/api/themes/' + encodeURIComponent(themeId), false);
                xhr.send();
                if (xhr.status !== 200) return;
                const css = JSON.parse(xhr.responseText).css;
                if (typeof css !== 'string' || !css) return;
                const styleEl = document.createElement('style');
                styleEl.id = 'dynamic-theme';
                styleEl.textContent = css;
                document.head.appendChild(styleEl);
                document.documentElement.setAttribute('data-theme', themeId);
            } catch (e) {
                // Fall back to the normal async applyTheme() path in app/settings.js
                console.error('Failed to preload theme:', e);
            }
        })();
    </script>
    
    <script defer src="/static/vendor/alpinejs/cdn.min.js"></script>
    
    <script>
        MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['$', '$']],
                displayMath: [['\\[', '\\]'], ['$$', '$$']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            startup: {
                typeset: false, // Formulas are typeset one at a time by the editor
                ready: () => {
                    MathJax.startup.defaultReady();
                    // \href makes a real link, and a javascript: one would run when clicked.
                    // Removed here because MathJax can rebuild a formula from this tree.
                    MathJax.startup.input.forEach((input) => input.postFilters.add(({ data }) => {
                        (data.root || data).walkTree((node) => {
                            if (node.attributes?.getExplicit('href') !== undefined) {
                                delete node.attributes.getAllAttributes().href;
                            }
                        });
                    }));
                }
            }
        };
    </script>
    <!-- Fonts and TeX extensions load relative to this script's path -->

<body x-data="noteApp()" x-init="init()" style="background-color: var(--bg-primary);" :class="{'zen-mode-active': zenMode}">

    <!-- Vault loading overlay. Centered floating card; the outer div is
         pointer-events:none so settings/theme/search/icon-rail stay clickable.
         Shown only when /api/notes is still in flight 800ms after boot AND the
         tree is currently empty — so small vaults / warm caches never see it. -->
    <div x-show="notesLoadingShowOverlay"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 flex items-center justify-center"
         style="z-index: 60; pointer-events: none;">
        <div class="px-6 py-4 rounded-lg shadow-2xl flex items-center gap-3"
             style="background-color: var(--bg-secondary); border: 1px solid var(--border-primary); color: var(--text-primary); pointer-events: auto;">
            <svg class="animate-spin h-5 w-5 flex-shrink-0" style="color: var(--accent-primary);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-sm" x-text="t('sidebar.loading_notes')"></span>
        </div>
    </div>

    <!-- Zen Mode Exit Button -->
    <button 
        x-show="zenMode"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4"
        x-transition:enter-end="opacity-60 translate-y-0"
        @click="toggleZenMode()"
        class="zen-exit-button"
        :title="t('zen_mode.exit_hint')"
    >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
        <span>Exit Zen</span>
    </button>
    
    <!-- Toast notifications (non-blocking; z-index above modals at 1100–1200; desktop-first top-right) -->
    <div
        class="fixed z-[1300] flex w-[min(28rem,calc(100vw-2rem))] flex-col items-stretch gap-2 pointer-events-none"
        style="top: max(1rem, env(safe-area-inset-top, 0px)); right: max(1rem, env(safe-area-inset-right, 0px));"
        role="region"
        :aria-label="t('toast.region_label')"
        aria-live="polite"
    >
        <template x-for="item in toasts" :key="item.id">
            <div
                x-transition:enter="transition ease-out duration-200"
                x-transition:enter-start="opacity-0 -translate-y-2"
                x-transition:enter-end="opacity-100 translate-y-0"
                x-transition:leave="transition ease-in duration-150"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0 -translate-y-1"
                class="pointer-events-auto flex items-start gap-2 rounded-lg border shadow-lg px-3 py-2.5 text-sm"
                :role="item.type === 'error' ? 'alert' : 'status'"
                :style="{
                    backgroundColor: 'var(--bg-secondary)',
                    color: 'var(--text-primary)',
                    borderColor: 'var(--border-primary)',
                    borderLeftWidth: '4px',
                    borderLeftStyle: 'solid',
                    borderLeftColor: item.type === 'error' ? 'var(--error)' : (item.type === 'warning' ? 'var(--warning)' : (item.type === 'success' ? 'var(--success)' : 'var(--accent-primary)'))
                }"
            >
                <span class="flex-1 min-w-0 break-words leading-snug" x-text="item.message"></span>
                <button
                    type="button"
                    class="flex-shrink-0 rounded p-0.5 opacity-70 hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-opacity-50"
                    style="color: var(--text-secondary); --tw-ring-color: var(--accent-primary);"
                    @click="dismissToast(item.id)"
                    :aria-label="t('toast.dismiss')"
                >
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </template>
    </div>
    
    <!-- Mobile Overlay -->
