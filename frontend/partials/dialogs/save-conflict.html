    <!-- A save refused because the note changed on disk. No Escape or outside click:
         every way out is a choice, so nothing is discarded by accident. -->
    <template x-if="saveConflict">
    <div class="fixed inset-0 flex items-center justify-center p-4"
         style="background-color: rgba(0, 0, 0, 0.5); z-index: 1250;">
        <div class="rounded-lg shadow-xl p-6 w-full mx-auto flex flex-col"
             :class="saveConflict.showDiff ? 'max-w-4xl' : 'max-w-lg'"
             style="background-color: var(--bg-secondary); color: var(--text-primary); max-height: 90vh;"
             role="alertdialog"
             aria-modal="true"
             aria-labelledby="save-conflict-title"
             aria-describedby="save-conflict-desc">
            <h2 id="save-conflict-title" class="text-xl font-bold mb-3" x-text="t('notes.save_conflict_title')"></h2>
            <p id="save-conflict-desc" class="text-sm mb-4 leading-relaxed" style="color: var(--text-secondary);" x-text="t('notes.save_conflict_message', { name: saveConflict.name })"></p>

            <button type="button" @click="saveConflictToggleDiff()" class="self-start text-sm font-medium mb-3 hover:underline" style="color: var(--accent-primary);"
                    :aria-expanded="saveConflict.showDiff"
                    x-text="saveConflict.showDiff ? t('notes.save_conflict_hide_compare') : t('notes.save_conflict_compare')"></button>

            <template x-if="saveConflict.showDiff">
                <div class="flex flex-col min-h-0 mb-4">
                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs mb-2" style="color: var(--text-secondary);">
                        <span><span class="diff-swatch diff-del"></span><span x-text="t('notes.save_conflict_legend_disk')"></span></span>
                        <span><span class="diff-swatch diff-add"></span><span x-text="t('notes.save_conflict_legend_mine')"></span></span>
                    </div>
                    <div class="diff-view custom-scrollbar">
                        <template x-for="(row, index) in saveConflict.rows" :key="index">
                            <div :class="'diff-row diff-' + row.type">
                                <span class="diff-sign" aria-hidden="true" x-text="row.type === 'del' ? '−' : row.type === 'add' ? '+' : ''"></span>
                                <span class="diff-text" x-text="row.type === 'fold' ? t('notes.save_conflict_unchanged', { count: row.count }) : row.text"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <p class="text-xs mb-3 flex-shrink-0" style="color: var(--text-tertiary);" x-text="t('notes.save_conflict_keep_both_hint', { name: saveConflict.name, suffix: t('notes.save_conflict_suffix') })"></p>
            <div class="flex flex-col-reverse sm:flex-row gap-2 sm:justify-end flex-shrink-0">
                <button type="button" @click="saveConflictChoose('disk')"
                        class="w-full sm:w-auto px-4 py-2.5 rounded font-medium save-conflict-button"
                        x-text="t('notes.save_conflict_reload')"></button>
                <button type="button" @click="saveConflictChoose('mine')"
                        class="w-full sm:w-auto px-4 py-2.5 rounded font-medium save-conflict-button"
                        x-text="t('notes.save_conflict_overwrite')"></button>
                <button type="button" @click="saveConflictChoose('both')"
                        class="w-full sm:w-auto px-4 py-2.5 rounded font-medium text-white save-conflict-button is-primary"
                        x-text="t('notes.save_conflict_keep_both')"></button>
            </div>
        </div>
    </div>
    </template>
