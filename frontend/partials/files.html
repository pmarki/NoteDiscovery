                                <!-- Media files as cards or a list. Expects files ({ path, type, label,
                                     modified, size }) and filesView ('cards' or 'list') from the
                                     x-data around the include. Items drag like sidebar files, so a
                                     drop in the editor embeds the file itself. Previews are
                                     thumbnails and must not drag as images, or the drop would
                                     upload the thumbnail as a new file. -->
                                <template x-if="filesView !== 'list'">
                                    <div class="files-grid">
                                        <template x-for="file in files" :key="file.path">
                                            <div @click="openItem(file.path, file.type)" class="file-card" :title="file.label"
                                                 draggable="true" @dragstart="onItemDragStart(file.path, file.type, $event)" @dragend="onItemDragEnd()">
                                                <div class="file-card-preview" aria-hidden="true">
                                                    <template x-if="file.type === 'document'">
                                                        <span class="file-card-pdf">
                                                            <!-- include: partials/pdf-icon.html -->
                                                        </span>
                                                    </template>
                                                    <span x-show="file.type !== 'document'" class="file-card-icon" x-text="getMediaIcon(file.type)"></span>
                                                    <template x-if="hasPreview(file.type)">
                                                        <img :src="thumbnailUrl(file)" alt="" loading="lazy" decoding="async" draggable="false" class="file-card-thumb" @error="$el.remove()">
                                                    </template>
                                                </div>
                                                <div class="file-card-name">
                                                    <span class="truncate" x-text="file.label"></span>
                                                </div>
                                                <div class="file-card-meta">
                                                    <span x-text="formatDate(file.modified)"></span>
                                                    <span x-text="formatSize(file.size)"></span>
                                                </div>
                                                <button
                                                    type="button"
                                                    @click.stop="deleteMedia(file.path)"
                                                    class="file-card-delete hidden sm:block"
                                                    :title="file.type === 'drawing' ? t('toolbar.delete_drawing') : t('toolbar.delete_image')"
                                                >
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                                    </svg>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="filesView === 'list'">
                                    <div class="homepage-list files-list">
                                        <template x-for="file in files" :key="file.path">
                                            <div @click="openItem(file.path, file.type)" class="homepage-list-row" :title="file.label"
                                                 draggable="true" @dragstart="onItemDragStart(file.path, file.type, $event)" @dragend="onItemDragEnd()">
                                                <span class="homepage-list-icon" aria-hidden="true">
                                                    <template x-if="file.type === 'document'">
                                                        <span class="files-list-pdf">
                                                            <!-- include: partials/pdf-icon.html -->
                                                        </span>
                                                    </template>
                                                    <span x-show="file.type !== 'document'" x-text="getMediaIcon(file.type)"></span>
                                                    <template x-if="hasPreview(file.type)">
                                                        <img :src="thumbnailUrl(file)" alt="" loading="lazy" decoding="async" draggable="false" class="files-list-thumb" @error="$el.remove()">
                                                    </template>
                                                </span>
                                                <span class="font-medium text-sm truncate flex-1 min-w-0" x-text="file.label"></span>
                                                <span class="text-xs flex-shrink-0" style="color: var(--text-tertiary);" x-text="formatDate(file.modified)"></span>
                                                <span class="text-xs flex-shrink-0 hidden sm:inline" style="color: var(--text-tertiary);" x-text="formatSize(file.size)"></span>
                                                <button
                                                    type="button"
                                                    @click.stop="deleteMedia(file.path)"
                                                    class="homepage-list-delete hidden sm:block"
                                                    :title="file.type === 'drawing' ? t('toolbar.delete_drawing') : t('toolbar.delete_image')"
                                                >
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                                    </svg>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
