    <!-- Wikilink / media autocomplete popup -->
    <div x-show="wikilinkAutocomplete.open"
         @mousedown.prevent
         class="wikilink-autocomplete"
         :style="`position: fixed; top: ${wikilinkAutocomplete.position.top}px; left: ${wikilinkAutocomplete.position.left}px; max-height: ${wikilinkAutocomplete.position.maxHeight}px; z-index: 1200; ${wikilinkAutocomplete.position.above ? 'transform: translateY(-100%);' : ''}`"
         x-cloak>
        <template x-for="(item, idx) in wikilinkAutocomplete.items" :key="item.insert + idx">
            <div>
                <div class="wl-group" x-show="item.heading" x-text="item.heading"></div>
                <div class="wikilink-autocomplete-item"
                     :class="{'active': idx === wikilinkAutocomplete.activeIndex}"
                     @mouseenter="wikilinkAutocomplete.activeIndex = idx"
                     @click="wlAccept(item)">
                    <span class="wl-label" x-text="item.label"></span>
                    <span class="wl-secondary" x-show="item.secondary" x-text="item.secondary"></span>
                </div>
            </div>
        </template>
    </div>

    <!-- Shown while an item is selected. mousedown.prevent keeps the cursor in the editor. -->
    <div x-show="itemPopup.open"
         @mousedown.prevent
         @mousedown.outside="if (viewMode === 'read') itemPopup.open = false"
         class="link-prompt"
         :style="`position: fixed; top: ${itemPopup.position.top}px; left: ${itemPopup.position.left}px; z-index: 1190; ${itemPopup.position.above ? 'transform: translateY(-100%);' : ''}`"
         x-cloak>
        <span class="link-popup-address" x-text="itemPopup.label" :title="itemPopup.label"></span>
        <template x-for="action in itemPopup.actions" :key="action.label">
            <button type="button" @click="action.run()" x-text="action.label"></button>
        </template>
    </div>

    <!-- Formatting for selected text. mousedown.prevent keeps the selection. -->
    <div x-show="selectionBubble.open"
         @mousedown.prevent
         x-ref="selectionBubble"
         class="link-prompt selection-bubble"
         :style="`position: fixed; top: ${selectionBubble.position.top}px; left: ${selectionBubble.position.left}px; z-index: 1190; ${selectionBubble.position.above ? 'transform: translateY(-100%);' : ''}`"
         x-cloak>
        <button type="button" x-show="!selectionBubble.codeOnly" @click="formatText('bold')" class="format-btn" :class="{ active: selectionBubble.active.bold }" :title="t('format.bold') + ' (Ctrl+B)'">
            <span class="font-bold">B</span>
        </button>
        <button type="button" x-show="!selectionBubble.codeOnly" @click="formatText('italic')" class="format-btn" :class="{ active: selectionBubble.active.italic }" :title="t('format.italic') + ' (Ctrl+I)'">
            <span class="italic">I</span>
        </button>
        <button type="button" x-show="!selectionBubble.codeOnly" @click="formatText('strikethrough')" class="format-btn" :class="{ active: selectionBubble.active.strike }" :title="t('format.strikethrough') + ' (Ctrl+Shift+S)'">
            <span class="line-through">S</span>
        </button>
        <button type="button" x-show="!selectionBubble.codeOnly" @click="formatText('code')" class="format-btn" :class="{ active: selectionBubble.active.code }" :title="t('format.code') + ' (Ctrl+E)'">
            <span class="font-mono text-xs">&lt;/&gt;</span>
        </button>
        <button type="button" x-show="!selectionBubble.codeOnly" @click="formatText('link')" class="format-btn" :class="{ active: selectionBubble.active.link }" :title="t('format.link') + ' (Ctrl+K)'">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
        </button>
        <button type="button" x-show="!selectionBubble.codeOnly" @click="formatText('clear')" class="format-btn" :title="t('format.clear_formatting') + ' (Ctrl+\\)'">
            <span class="text-xs">T<sub>x</sub></span>
        </button>
        <button type="button" x-show="!selectionBubble.inTable" @click="toggleTurnIntoMenu()" class="selection-turn-into" x-text="t('format.turn_into')"></button>
    </div>

    <!-- What selected text can become. mousedown.prevent keeps the selection. -->
    <div x-show="turnIntoMenu.open"
         @mousedown.prevent
         class="wikilink-autocomplete"
         :style="`position: fixed; top: ${turnIntoMenu.position.top}px; left: ${turnIntoMenu.position.left}px; max-height: ${turnIntoMenu.maxHeight}px; z-index: 1195; ${turnIntoMenu.position.above ? 'transform: translateY(-100%);' : ''}`"
         x-cloak>
        <template x-for="block in turnIntoBlocks" :key="block.type">
            <div class="wikilink-autocomplete-item" :class="{ active: block.type === selectionBubble.block }" @click="turnInto(block.type)">
                <span class="wl-label" x-text="t(block.label)"></span>
            </div>
        </template>
    </div>

    <!-- Actions for the table holding the cursor. mousedown.prevent keeps the cursor in the editor. -->
    <div x-show="tablePopup.open"
         @mousedown.prevent
         class="link-prompt selection-bubble"
         :style="`position: fixed; top: ${tablePopup.top}px; left: ${tablePopup.left}px; z-index: 1190;`"
         x-cloak>
        <button type="button" @click="formatText('addRow')" class="format-btn" :title="t('format.add_row')">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 5h16M4 10h16M12 14v7M8.5 17.5h7"></path></svg>
        </button>
        <button type="button" @click="formatText('addColumn')" class="format-btn" :title="t('format.add_column')">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M5 4v16M10 4v16M14 12h7M17.5 8.5v7"></path></svg>
        </button>
        <button type="button" @click="formatText('deleteRow')" class="format-btn" :title="t('format.delete_row')">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 5h16M4 10h16M8.5 17.5h7"></path></svg>
        </button>
        <button type="button" @click="formatText('deleteColumn')" class="format-btn" :title="t('format.delete_column')">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M5 4v16M10 4v16M14 12h7"></path></svg>
        </button>
        <button type="button" @click="formatText('deleteTable')" class="format-btn" :title="t('format.delete_table')" style="color: var(--error);">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
    </div>

    <!-- Opens the / menu on an empty line. mousedown.prevent keeps the keyboard up on phones. -->
    <button type="button"
            x-show="addButton.open"
            @mousedown.prevent
            @click="openAddMenu()"
            class="add-block-button"
            :style="`top: ${addButton.top}px; left: ${addButton.left}px;`"
            :title="t('format.add_block')"
            :aria-label="t('format.add_block')"
            x-cloak>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M12 5v14M5 12h14"></path></svg>
    </button>

    <!-- Source of a formula or diagram -->
    <div x-show="sourcePrompt.open" class="fixed inset-0" style="z-index: 1199;" @click="closeSourcePrompt()" x-cloak></div>
    <div x-show="sourcePrompt.open"
         class="link-prompt source-prompt"
         :style="`position: fixed; top: ${sourcePrompt.position.top}px; left: ${sourcePrompt.position.left}px; z-index: 1200; ${sourcePrompt.position.above ? 'transform: translateY(-100%);' : ''}`"
         x-cloak>
        <textarea id="source-prompt-input"
                  rows="6"
                  spellcheck="false"
                  x-model="sourcePrompt.value"
                  :aria-label="sourcePrompt.label"
                  @keydown.ctrl.enter.prevent="applySourcePrompt()"
                  @keydown.meta.enter.prevent="applySourcePrompt()"
                  @keydown.escape.stop="closeSourcePrompt()"></textarea>
        <div class="source-prompt-actions">
            <button type="button" @click="closeSourcePrompt()" x-text="t('common.cancel')"></button>
            <button type="button" @click="applySourcePrompt()" x-text="t('common.ok')"></button>
        </div>
    </div>

    <!-- Link / image address popover -->
    <div x-show="linkPrompt.open" class="fixed inset-0" style="z-index: 1199;" @click="closeLinkPrompt()" x-cloak></div>
    <div x-show="linkPrompt.open"
         class="link-prompt"
         :style="`position: fixed; top: ${linkPrompt.position.top}px; left: ${linkPrompt.position.left}px; z-index: 1200; ${linkPrompt.position.above ? 'transform: translateY(-100%);' : ''}`"
         x-cloak>
        <input id="link-prompt-input"
               type="text"
               x-model="linkPrompt.href"
               :aria-label="t('format.link')"
               :placeholder="linkPrompt.type === 'wikilink' ? '' : 'https://'"
               @keydown.enter.prevent="applyLinkPrompt()"
               @keydown.escape.stop="closeLinkPrompt()">
        <button type="button" @click="applyLinkPrompt()" x-text="t('common.ok')"></button>
        <button type="button" x-show="linkPrompt.canRemove" @click="removeLinkFromPrompt()" x-text="t('common.delete')"></button>
    </div>
